name: TODO workshop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: ./scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: .artifacts/last-verify.log
